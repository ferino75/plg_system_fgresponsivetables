PLG_SYSTEM_FGRESPONSIVETABLES="Systém - FG Responzívne tabuľky"
PLG_SYSTEM_FGRESPONSIVETABLES_XML_DESCRIPTION="Načíta CSS a malý skript, ktorý na úzkych obrazovkách zloží tabuľky s triedou <code>responsiv</code> do kariet. Chýbajúce <code>data-label</code> doplní z hlavičky tabuľky."
PLG_SYSTEM_FGRESPONSIVETABLES_SELECTOR_LABEL="Selektor tabuliek"
PLG_SYSTEM_FGRESPONSIVETABLES_SELECTOR_DESC="CSS selektor tabuliek, ktoré sa majú spracovať. Predvolene table.responsiv — teda len tabuľky s touto triedou."
PLG_SYSTEM_FGRESPONSIVETABLES_EXCLUDE_LABEL="Vylúčiť"
PLG_SYSTEM_FGRESPONSIVETABLES_EXCLUDE_DESC="CSS selektor tabuliek, ktoré sa nemajú spracovať. Pridajte triedu no-responsiv na tabuľku alebo obal."
PLG_SYSTEM_FGRESPONSIVETABLES_AUTO_LABELS_LABEL="Doplniť data-label"
PLG_SYSTEM_FGRESPONSIVETABLES_AUTO_LABELS_DESC="Ak bunka nemá data-label, skript ho vezme z príslušného stĺpca v thead. Existujúce atribúty sa neprepisujú."
PLG_SYSTEM_FGRESPONSIVETABLES_AUTO_CLASS_LABEL="Upraviť všetky tabuľky v článku"
PLG_SYSTEM_FGRESPONSIVETABLES_AUTO_CLASS_DESC="Pridá triedu responsiv aj tabuľkám bez nej (v article / item-page / blog / category). Tabuľky s triedou no-responsiv sa vynechajú."
PLG_SYSTEM_FGRESPONSIVETABLES_WRAP_LABEL="Obaliť tabuľku"
PLG_SYSTEM_FGRESPONSIVETABLES_WRAP_DESC="Obalí tabuľku do .rwd-table-wrap. Skladanie do kariet potom reaguje na šírku stĺpca (modul, accordion), nielen na šírku okna."
PLG_SYSTEM_FGRESPONSIVETABLES_ARIA_ROLES_LABEL="Prístupnosť (ARIA role)"
PLG_SYSTEM_FGRESPONSIVETABLES_ARIA_ROLES_DESC="Pridá role table/row/cell priamo do HTML, aby čítačky obrazovky (napr. VoiceOver) rozpoznali tabuľku aj po zložení do kariet na mobile."
PLG_SYSTEM_FGRESPONSIVETABLES_CARD_STYLE_LABEL="Štýl mobilnej karty"
PLG_SYSTEM_FGRESPONSIVETABLES_CARD_STYLE_DESC="Ako má vyzerať jeden zložený riadok na mobile: orámovaná karta so zaoblením a tieňom, alebo len jednoduché deliace čiary bez rámika (pôvodný štýl z tabulka.css)."
PLG_SYSTEM_FGRESPONSIVETABLES_CARD_STYLE_CARD="Orámovaná karta (zaoblenie, tieň)"
PLG_SYSTEM_FGRESPONSIVETABLES_CARD_STYLE_LINES="Len deliace čiary (bez rámika)"
PLG_SYSTEM_FGRESPONSIVETABLES_CLEAR_FLOATS_LABEL="Vyčistiť plávajúce elementy pred tabuľkou"
PLG_SYSTEM_FGRESPONSIVETABLES_CLEAR_FLOATS_DESC="Pridá clear:both pred tabuľku — pomáha, ak pred ňou ostáva nevyčistený float:right obrázok zo šablóny/obsahu, ktorý by inak tabuľku zoškrtil. Predvolene vypnuté, keďže na iných stránkach môže byť tabuľka legitímne vedľa floatu."
PLG_SYSTEM_FGRESPONSIVETABLES_BREAKPOINT_LABEL="Hranica (px)"
PLG_SYSTEM_FGRESPONSIVETABLES_BREAKPOINT_DESC="Pod touto šírkou obalu sa tabuľka zloží do kariet. Predvolene 600."
PLG_SYSTEM_FGRESPONSIVETABLES_MIN_WIDTH_LABEL="Minimálna šírka tabuľky (px)"
PLG_SYSTEM_FGRESPONSIVETABLES_MIN_WIDTH_DESC="Bez toho prehliadač pri nezloženej tabuľke radšej stĺpce stlačí, než aby preteklo — v pásme medzi hranicou skladania a plnou šírkou (tablet, úzky modul, otvorený akordeón) sa tak tabuľka nezloží ani neposkrolluje, len sa nečitateľne zúži. Nastavte minimálnu šírku v px, aby v tomto pásme radšej naskočil bočný scroll (aj s tieňovým indikátorom). 0 = vypnuté (predvolené, pôvodné správanie)."
PLG_SYSTEM_FGRESPONSIVETABLES_FIELDSET_COMPATIBILITY="Kompatibilita"
PLG_SYSTEM_FGRESPONSIVETABLES_LOAD_LEGACY_LABEL="Načítať legacy kompatibilné štýly"
PLG_SYSTEM_FGRESPONSIVETABLES_LOAD_LEGACY_DESC="Načíta legacy.css s pomocnými triedami prenesenými z pôvodného tabulka.css (.responsive-table, .day-section*, .day-content, .sirka-25/30, .col-w-md-*). Tieto názvy sú dosť všeobecné na to, že by mohli na inom webe znamenať niečo úplně iné — zapnite Áno na pôvodných weboch, ktoré tieto triedy reálne používajú (napr. fnspza.sk), a nechajte Nie na nových/cudzích inštaláciách."
PLG_SYSTEM_FGRESPONSIVETABLES_SCROLL_REGION="Tabuľka so skrolovaním do strán"
