PLG_SYSTEM_FGRESPONSIVETABLES="System - FG Responsive Tables"
PLG_SYSTEM_FGRESPONSIVETABLES_XML_DESCRIPTION="Ładuje CSS i mały skrypt, który tabele z klasą <code>responsiv</code> na wąskich ekranach układa w opisane karty. Brakujące atrybuty <code>data-label</code> są uzupełniane z nagłówka tabeli."
PLG_SYSTEM_FGRESPONSIVETABLES_SELECTOR_LABEL="Selektor tabel"
PLG_SYSTEM_FGRESPONSIVETABLES_SELECTOR_DESC="Selektor CSS tabel do ulepszenia. Domyślnie table.responsiv — tylko tabele z tą klasą."
PLG_SYSTEM_FGRESPONSIVETABLES_EXCLUDE_LABEL="Wyklucz"
PLG_SYSTEM_FGRESPONSIVETABLES_EXCLUDE_DESC="Selektor CSS tabel do pominięcia. Dodaj klasę no-responsiv do tabeli lub kontenera."
PLG_SYSTEM_FGRESPONSIVETABLES_AUTO_LABELS_LABEL="Uzupełniaj data-label"
PLG_SYSTEM_FGRESPONSIVETABLES_AUTO_LABELS_DESC="Jeśli komórka nie ma data-label, skrypt kopiuje go z odpowiedniej kolumny thead. Istniejące atrybuty nigdy nie są nadpisywane."
PLG_SYSTEM_FGRESPONSIVETABLES_AUTO_CLASS_LABEL="Ulepsz wszystkie tabele w artykułach"
PLG_SYSTEM_FGRESPONSIVETABLES_AUTO_CLASS_DESC="Dodaje klasę responsiv również tabelom, które jej nie mają (wewnątrz article / item-page / blog / category). Tabele z klasą no-responsiv są pomijane."
PLG_SYSTEM_FGRESPONSIVETABLES_AUTO_CLASS_SELECTOR_LABEL="Selektor kontenerów"
PLG_SYSTEM_FGRESPONSIVETABLES_AUTO_CLASS_SELECTOR_DESC="Lista selektorów CSS oddzielonych przecinkami określająca, gdzie klasa responsiv jest dodawana automatycznie. Domyślna lista pasuje do rdzenia Joomla com_content (article/item-page/blog/category) — szablony takie jak Helix, JD czy T4 mogą owijać treść inaczej, więc zastąp lub rozszerz to o własne selektory (np. .article-content table)."
PLG_SYSTEM_FGRESPONSIVETABLES_WRAP_LABEL="Owiń tabelę"
PLG_SYSTEM_FGRESPONSIVETABLES_WRAP_DESC="Owija każdą tabelę w .rwd-table-wrap, dzięki czemu układanie w karty zależy od szerokości kolumny (moduł, akordeon), a nie tylko od okna przeglądarki."
PLG_SYSTEM_FGRESPONSIVETABLES_ARIA_ROLES_LABEL="Dostępność (role ARIA)"
PLG_SYSTEM_FGRESPONSIVETABLES_ARIA_ROLES_DESC="Dodaje role tabeli/wiersza/komórki bezpośrednio do HTML, dzięki czemu czytniki ekranu (np. VoiceOver) nadal rozpoznają tabelę po jej ułożeniu w karty na urządzeniach mobilnych."
PLG_SYSTEM_FGRESPONSIVETABLES_CARD_STYLE_LABEL="Styl karty mobilnej"
PLG_SYSTEM_FGRESPONSIVETABLES_CARD_STYLE_DESC="Jak powinien wyglądać jeden ułożony wiersz na urządzeniu mobilnym: karta z obramowaniem, zaokrąglonymi rogami i cieniem, albo zwykłe linie oddzielające bez obramowania (oryginalny wygląd tabulka.css)."
PLG_SYSTEM_FGRESPONSIVETABLES_CARD_STYLE_CARD="Karta z obramowaniem (zaokrąglona, cień)"
PLG_SYSTEM_FGRESPONSIVETABLES_CARD_STYLE_LINES="Zwykłe linie oddzielające (bez obramowania)"
PLG_SYSTEM_FGRESPONSIVETABLES_CLEAR_FLOATS_LABEL="Wyczyść floaty przed tabelą"
PLG_SYSTEM_FGRESPONSIVETABLES_CLEAR_FLOATS_DESC="Dodaje clear:both przed tabelą — pomaga, gdy poprzedzający obraz z float:right (z szablonu lub treści) pozostaje nieoczyszczony i w przeciwnym razie ścisnąłby tabelę obok siebie. Domyślnie wyłączone, ponieważ na innych stronach tabela może zasadnie stać obok pływającego elementu."
PLG_SYSTEM_FGRESPONSIVETABLES_BREAKPOINT_LABEL="Punkt przełamania (px)"
PLG_SYSTEM_FGRESPONSIVETABLES_BREAKPOINT_DESC="Poniżej tej szerokości kontenera tabela układa się w karty. Domyślnie 600."
PLG_SYSTEM_FGRESPONSIVETABLES_MIN_WIDTH_LABEL="Minimalna szerokość tabeli (px)"
PLG_SYSTEM_FGRESPONSIVETABLES_MIN_WIDTH_DESC="Bez tego przeglądarka wolałaby zmniejszyć kolumny, niż pozwolić nieułożonej tabeli na przepełnienie — w paśmie między punktem przełamania a pełną szerokością (tablet, wąski moduł, otwarty akordeon) tabela wtedy ani się nie układa, ani nie przewija, tylko ściska się w nieczytelne kolumny. Ustaw minimalną szerokość w px, aby w tym paśmie zamiast tego włączyło się przewijanie poziome (ze wskaźnikiem cienia). 0 = wyłączone (domyślnie, pierwotne zachowanie)."
PLG_SYSTEM_FGRESPONSIVETABLES_WATCH_DOM_LABEL="Obserwuj dynamicznie dodawane tabele"
PLG_SYSTEM_FGRESPONSIVETABLES_WATCH_DOM_DESC="Skrypt zwykle uruchamia się raz przy wczytaniu strony — tabela dodana później przez AJAX (leniwie wczytywany panel zakładek/akordeonu, SP Page Builder, własny fetch) pozostaje nieprzetworzona, dopóki coś nie wywoła ręcznie window.rwdTablesEnhance(). To włącza MutationObserver, który wychwytuje to automatycznie — kosztem ciągłego obserwowania całej strony, nawet tam, gdzie nic nigdy nie ładuje się dynamicznie. Domyślnie wyłączone; włącz tylko na stronach, które tego naprawdę potrzebują."
PLG_SYSTEM_FGRESPONSIVETABLES_LOAD_ONLY_COM_CONTENT_LABEL="Ładuj tylko na stronach com_content"
PLG_SYSTEM_FGRESPONSIVETABLES_LOAD_ONLY_COM_CONTENT_DESC="CSS i JS (razem około 10 KB nieskompresowane) zwykle trafiają do <head> na każdej stronie frontendu, nawet tam, gdzie nie ma żadnej tabeli. To ogranicza ładowanie do stron z option=com_content (artykuły, kategorie) — realna oszczędność na stronie bogatej w treść. Uwaga: jeśli masz tabelę w module lub innym komponencie, wtyczka po włączeniu tego w ogóle się tam nie zastosuje. Domyślnie wyłączone (ładuje się wszędzie, jak dotychczas)."
PLG_SYSTEM_FGRESPONSIVETABLES_FIELDSET_COMPATIBILITY="Zgodność"
PLG_SYSTEM_FGRESPONSIVETABLES_LOAD_LEGACY_LABEL="Ładuj starsze zgodne style"
PLG_SYSTEM_FGRESPONSIVETABLES_LOAD_LEGACY_DESC="Ładuje legacy.css z klasami pomocniczymi przeniesionymi z oryginalnego tabulka.css (.responsive-table, .day-section*, .day-content, .sirka-25/30, .col-w-md-*). Te nazwy są na tyle ogólne, że inna strona mogła już używać ich do czegoś niezwiązanego — włącz Tak na oryginalnych stronach, które faktycznie korzystają z tych klas (np. fnspza.sk), a zostaw Nie na nowych/obcych instalacjach."
PLG_SYSTEM_FGRESPONSIVETABLES_SCROLL_REGION="Tabela z przewijaniem w bok"
