PLG_SYSTEM_FGRESPONSIVETABLES="System - FG Responsive Tables"
PLG_SYSTEM_FGRESPONSIVETABLES_XML_DESCRIPTION="Loads CSS and a small script that stacks tables with the <code>responsiv</code> class into labelled cards on narrow screens. Missing <code>data-label</code> attributes are filled from the table header."
PLG_SYSTEM_FGRESPONSIVETABLES_SELECTOR_LABEL="Table selector"
PLG_SYSTEM_FGRESPONSIVETABLES_SELECTOR_DESC="CSS selector of tables to enhance. Default table.responsiv — only tables with that class."
PLG_SYSTEM_FGRESPONSIVETABLES_EXCLUDE_LABEL="Exclude"
PLG_SYSTEM_FGRESPONSIVETABLES_EXCLUDE_DESC="CSS selector of tables to skip. Add the no-responsiv class to a table or wrapper."
PLG_SYSTEM_FGRESPONSIVETABLES_AUTO_LABELS_LABEL="Fill data-label"
PLG_SYSTEM_FGRESPONSIVETABLES_AUTO_LABELS_DESC="If a cell has no data-label, the script copies it from the matching thead column. Existing attributes are never overwritten."
PLG_SYSTEM_FGRESPONSIVETABLES_AUTO_CLASS_LABEL="Enhance all article tables"
PLG_SYSTEM_FGRESPONSIVETABLES_AUTO_CLASS_DESC="Also add the responsiv class to tables that do not have it (inside article / item-page / blog / category). Tables with no-responsiv are skipped."
PLG_SYSTEM_FGRESPONSIVETABLES_AUTO_CLASS_SELECTOR_LABEL="Container selector"
PLG_SYSTEM_FGRESPONSIVETABLES_AUTO_CLASS_SELECTOR_DESC="A comma-separated CSS selector list controlling where the responsiv class gets added automatically. The default matches Joomla core com_content (article/item-page/blog/category) — templates like Helix, JD, or T4 may wrap content differently, so replace or extend this to match your own markup (e.g. .article-content table)."
PLG_SYSTEM_FGRESPONSIVETABLES_WRAP_LABEL="Wrap table"
PLG_SYSTEM_FGRESPONSIVETABLES_WRAP_DESC="Wrap each table in .rwd-table-wrap so stacking follows column width (module, accordion), not just the viewport."
PLG_SYSTEM_FGRESPONSIVETABLES_ARIA_ROLES_LABEL="Accessibility (ARIA roles)"
PLG_SYSTEM_FGRESPONSIVETABLES_ARIA_ROLES_DESC="Adds table/row/cell roles directly to the HTML so screen readers (e.g. VoiceOver) still recognise the table once it stacks into cards on mobile."
PLG_SYSTEM_FGRESPONSIVETABLES_CARD_STYLE_LABEL="Mobile card style"
PLG_SYSTEM_FGRESPONSIVETABLES_CARD_STYLE_DESC="How one stacked row should look on mobile: a bordered card with rounded corners and a shadow, or plain dividing lines with no border (the original tabulka.css look)."
PLG_SYSTEM_FGRESPONSIVETABLES_CARD_STYLE_CARD="Bordered card (rounded, shadow)"
PLG_SYSTEM_FGRESPONSIVETABLES_CARD_STYLE_LINES="Plain dividing lines (no border)"
PLG_SYSTEM_FGRESPONSIVETABLES_CLEAR_FLOATS_LABEL="Clear floats before the table"
PLG_SYSTEM_FGRESPONSIVETABLES_CLEAR_FLOATS_DESC="Adds clear:both before the table — helps if a preceding float:right image (from the template or content) is left uncleared and would otherwise squeeze the table beside it. Off by default, since on other pages a table may legitimately sit next to a float."
PLG_SYSTEM_FGRESPONSIVETABLES_BREAKPOINT_LABEL="Breakpoint (px)"
PLG_SYSTEM_FGRESPONSIVETABLES_BREAKPOINT_DESC="Below this wrapper width the table stacks into cards. Default 600."
PLG_SYSTEM_FGRESPONSIVETABLES_MIN_WIDTH_LABEL="Minimum table width (px)"
PLG_SYSTEM_FGRESPONSIVETABLES_MIN_WIDTH_DESC="Without this, a browser would rather shrink columns to fit than let a non-stacked table overflow — so in the band between the stacking breakpoint and full width (a tablet, a narrow module, an open accordion), the table neither stacks nor scrolls, it just squeezes into unreadable columns. Set a minimum width in px so horizontal scroll (with the shadow indicator) kicks in instead in that band. 0 = off (default, original behaviour)."
PLG_SYSTEM_FGRESPONSIVETABLES_WATCH_DOM_LABEL="Watch for dynamically added tables"
PLG_SYSTEM_FGRESPONSIVETABLES_WATCH_DOM_DESC="The script normally runs once when the page loads — a table added later via AJAX (a lazy-loaded tab/accordion panel, SP Page Builder, a custom fetch) stays unprocessed unless something calls window.rwdTablesEnhance() manually. This turns on a MutationObserver that catches that automatically, at the cost of watching the whole page continuously, even on pages where nothing ever loads dynamically. Off by default; turn on only for sites that actually need it."
PLG_SYSTEM_FGRESPONSIVETABLES_LOAD_ONLY_COM_CONTENT_LABEL="Load only on com_content pages"
PLG_SYSTEM_FGRESPONSIVETABLES_LOAD_ONLY_COM_CONTENT_DESC="CSS and JS (roughly 10KB uncompressed together) normally go into <head> on every single frontend page, even ones with no table at all. This restricts loading to pages with option=com_content (articles, categories) — a real saving on a content-heavy site. Careful: if you have a table inside a module or another component, the plugin won't apply there at all once this is on. Off by default (loads everywhere, as before)."
PLG_SYSTEM_FGRESPONSIVETABLES_FIELDSET_COMPATIBILITY="Compatibility"
PLG_SYSTEM_FGRESPONSIVETABLES_LOAD_LEGACY_LABEL="Load legacy compatible styles"
PLG_SYSTEM_FGRESPONSIVETABLES_LOAD_LEGACY_DESC="Loads legacy.css with helper classes ported from the original tabulka.css (.responsive-table, .day-section*, .day-content, .sirka-25/30, .col-w-md-*). These names are generic enough that another site could already use them for something unrelated — turn this ON for the original sites that actually rely on these classes (e.g. fnspza.sk), and leave it OFF on new/unrelated installs."
PLG_SYSTEM_FGRESPONSIVETABLES_SCROLL_REGION="Scrollable table"
