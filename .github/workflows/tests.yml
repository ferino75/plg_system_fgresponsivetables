name: Tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  playwright:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Check JS syntax
        run: node --check media/js/fgresponsivetables.js

      - name: Run tests
        run: npx playwright test

      - name: Upload screenshots and report (always, even on failure)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
          retention-days: 30
